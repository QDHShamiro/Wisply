name: probe-edge
on:
  push:
    branches: ["feat/wait-ci"]
    paths: [".github/workflows/probe-edge.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Variants
        shell: bash
        run: |
          EDGE="/c/Program Files (x86)/Microsoft/Edge/Application/msedge.exe"
          titles() { powershell.exe -NoProfile -Command 'Get-Process msedge | Where-Object { $_.MainWindowTitle } | ForEach-Object { $_.MainWindowTitle }'; }
          try() {
            taskkill //F //IM msedge.exe > /dev/null 2>&1 || true
            sleep 3
            echo "== $1"
            shift
            "$EDGE" "$@" > /dev/null 2>&1 &
            for i in 1 2 3 4; do sleep 5; echo "t=$((i*5))"; titles; done
          }
          tasklist //fi "imagename eq msedge.exe" | head -5
          try H https://example.com/
          try S edge://settings/
          try P --user-data-dir="$RUNNER_TEMP/p2" --no-first-run --remote-debugging-port=9333 about:blank
          curl -s http://127.0.0.1:9333/json/version | head -3 || true
          curl -s -X PUT "http://127.0.0.1:9333/json/new?edge://extensions/" | head -8 || true
          sleep 5
          titles
          curl -s http://127.0.0.1:9333/json/list | grep -E '"(title|url)"' | head
