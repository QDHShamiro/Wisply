<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pupil</title>
<style>
:root { --bg:#f6f5f1; --side:#efeee8; --card:#ffffff; --ink:#1b1b19; --soft:#6f6e68; --faint:#a19f97; --line:#e4e2da; --pill:#efeee8; --bad:#b4232a; --good:#1f7a55; --run:#a36a00; --grow:220px; --halo:rgba(20,20,15,.07); --ease:cubic-bezier(.2,.75,.25,1); }
:root { --serif:"Walbaum Display","Walbaum","Source Serif 4",Georgia,serif; --sans:Inter,"Neue Haas Grotesk Text Pro","Helvetica Neue",Arial,sans-serif; --mono:"JetBrains Mono",Consolas,"Courier New",monospace; --shadow:0 1px 2px var(--halo), 0 8px 28px var(--halo); }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:15.5px/1.62 var(--sans); -webkit-font-smoothing:antialiased; }
button { font:inherit; color:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 14px; transition:border-color .15s, background .15s, opacity .15s, transform .12s var(--ease); }
button:hover { border-color:var(--faint); }
button:active { transform:scale(.97); }
button:disabled { opacity:.55; cursor:default; transform:none; }
.locked { max-width:560px; margin:18vh auto 0; padding:0 24px; font-family:var(--serif); font-size:26px; line-height:1.25; }
.app { display:grid; grid-template-columns:260px 1fr; height:100vh; animation:fade .4s var(--ease); }
.side { display:flex; flex-direction:column; gap:10px; padding:16px 12px; background:var(--side); border-right:1px solid var(--line); min-height:0; }
.logo { align-self:flex-start; display:flex; align-items:center; gap:9px; padding:4px 8px 8px; font-family:var(--serif); font-size:21px; letter-spacing:-.2px; }
.logo i { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--faint); transition:background .3s; }
.logo i.up { background:var(--good); animation:beat 2.4s infinite; }
.logo i.test { background:var(--run); }
#new { text-align:left; border-radius:12px; padding:8px 12px; }
.chats { flex:1; overflow:auto; display:flex; flex-direction:column; gap:2px; margin-top:6px; }
.chat { display:flex; align-items:center; gap:6px; padding:7px 10px; border-radius:10px; cursor:pointer; color:var(--soft); font-size:14px; transition:background .15s, color .15s; }
.chat:hover, .chat.on { background:var(--card); color:var(--ink); }
.chat span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chat b { visibility:hidden; font-weight:400; padding:0 4px; }
.chat:hover b { visibility:visible; }
.main { display:flex; flex-direction:column; min-width:0; height:100vh; }
.top { display:flex; align-items:center; gap:12px; padding:10px 24px; }
.model { font-family:var(--serif); font-size:19px; letter-spacing:-.2px; }
.status { margin-left:auto; padding:4px 12px; border-radius:999px; background:var(--card); border:1px solid var(--line); font-size:12.5px; color:var(--soft); transition:color .2s; }
.note { margin:6px 24px 0; padding:11px 16px; border-radius:14px; background:var(--card); border:1px solid var(--line); color:var(--soft); animation:rise .3s var(--ease); }
.feed { flex:1; overflow:auto; padding:8px 24px 24px; }
.inner { max-width:760px; margin:0 auto; }
.hello { padding:13vh 0 0; text-align:center; animation:rise .5s var(--ease); }
.hello h1 { font-family:var(--serif); font-weight:400; font-size:42px; line-height:1.08; letter-spacing:-.4px; margin:0 0 10px; }
.hello p { color:var(--soft); margin:0 auto 28px; max-width:520px; }
.starters { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:10px; text-align:left; }
.starters button { border-radius:14px; text-align:left; padding:12px 14px; color:var(--soft); }
.starters button:hover { color:var(--ink); box-shadow:var(--shadow); transform:translateY(-1px); }
.msg { margin:0 0 28px; }
.msg.fresh { animation:rise .38s var(--ease) both; }
.msg.user { display:flex; justify-content:flex-end; }
.bub { max-width:80%; background:var(--pill); border-radius:18px; padding:10px 16px; }
.plain { white-space:pre-wrap; overflow-wrap:anywhere; }
.pics { display:flex; gap:8px; flex-wrap:wrap; margin:2px 0 8px; }
.pics img { max-width:220px; max-height:220px; border-radius:12px; display:block; }
.chips { display:flex; gap:6px; flex-wrap:wrap; margin:2px 0 8px; }
.chip { display:inline-flex; align-items:center; gap:7px; max-width:100%; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:5px 10px; font-size:13px; animation:rise .25s var(--ease); }
.chip img { height:36px; border-radius:7px; display:block; }
.chip i { font-style:normal; font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--soft); }
.chip span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:260px; }
.chip u { text-decoration:none; color:var(--soft); white-space:nowrap; }
.chip b { font-weight:400; color:var(--soft); cursor:pointer; padding:0 2px; }
.chip b:hover { color:var(--ink); }
.who { display:flex; align-items:center; gap:9px; font-family:var(--serif); font-size:16px; margin:0 0 6px; }
.who::before { content:""; width:16px; height:16px; border-radius:50%; background:radial-gradient(circle at 50% 50%, var(--ink) 0 34%, var(--card) 38% 100%); box-shadow:0 0 0 1.5px var(--ink); }
.live .who::before { animation:gaze 2.4s var(--ease) infinite; animation-delay:calc(var(--t, 0) * -1ms); }
.body { overflow-wrap:anywhere; }
.body p { margin:0 0 12px; }
.body ul, .body ol { margin:0 0 12px; padding-left:22px; }
.body li { margin:2px 0; }
.body hr { border:0; border-top:1px solid var(--line); margin:16px 0; }
.body .h { font-family:var(--serif); font-weight:500; margin:18px 0 6px; line-height:1.2; }
.body .h1 { font-size:26px; } .body .h2 { font-size:22px; } .body .h3 { font-size:19px; } .body .h4 { font-size:17px; }
.body code { font-family:var(--mono); font-size:13px; background:var(--pill); border-radius:6px; padding:1px 5px; }
.body a { color:inherit; text-underline-offset:2px; }
.body table { border-collapse:collapse; margin:0 0 12px; display:block; overflow:auto; }
.body th, .body td { border:1px solid var(--line); padding:6px 10px; text-align:left; background:var(--card); }
.typing .body > :last-child::after { content:""; display:inline-block; width:8px; height:8px; margin-left:5px; border-radius:50%; background:var(--ink); vertical-align:middle; animation:blink 1s ease-in-out infinite; animation-delay:calc(var(--t, 0) * -1ms); }
.code { border:1px solid var(--line); border-radius:14px; overflow:hidden; margin:0 0 12px; background:var(--card); }
.codebar { display:flex; align-items:center; justify-content:space-between; padding:5px 8px 5px 14px; border-bottom:1px solid var(--line); color:var(--soft); font-size:12px; }
.codebar button { padding:2px 10px; font-size:12px; }
.code pre { margin:0; padding:12px 14px; overflow:auto; }
.code pre code { background:none; padding:0; }
.thought, .steps { margin:0 0 10px; color:var(--soft); font-size:13px; }
.thought summary, .steps summary { cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:7px; padding:3px 11px 3px 9px; border-radius:999px; border:1px solid var(--line); background:var(--card); user-select:none; transition:border-color .15s, color .15s; }
.thought summary:hover, .steps summary:hover { border-color:var(--faint); color:var(--ink); }
.thought summary::-webkit-details-marker, .steps summary::-webkit-details-marker { display:none; }
.thought summary::before, .steps summary::before { content:""; width:5px; height:5px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; transform:rotate(-45deg); transition:transform .2s var(--ease); }
details[open] > summary::before { transform:rotate(45deg); }
.thought > div { border-left:2px solid var(--line); padding:6px 0 6px 14px; margin-top:8px; max-height:300px; overflow:auto; white-space:pre-wrap; line-height:1.55; }
.steps ol { list-style:none; margin:8px 0 0; padding:4px 0 4px 14px; border-left:2px solid var(--line); }
.steps li { margin:1px 0; }
.steps .at { display:inline-block; min-width:56px; color:var(--faint); font-variant-numeric:tabular-nums; }
.wait { display:inline-block; color:transparent; background:linear-gradient(90deg, var(--faint) 0%, var(--faint) 35%, var(--ink) 50%, var(--faint) 65%, var(--faint) 100%); background-size:300% 100%; -webkit-background-clip:text; background-clip:text; animation:shimmer 1.6s linear infinite; animation-delay:calc(var(--t, 0) * -1ms); }
.flag, .fault { color:var(--bad); font-size:13px; margin:4px 0; }
.fault { margin:0 0 8px; animation:rise .25s var(--ease); }
.lost { color:var(--soft); font-size:13px; }
.meta { display:flex; flex-wrap:wrap; align-items:center; gap:6px; color:var(--soft); font-size:12px; min-height:26px; margin-top:6px; }
.pill { display:inline-flex; align-items:center; gap:6px; padding:2px 9px; border-radius:999px; background:var(--pill); font-variant-numeric:tabular-nums; white-space:nowrap; }
.pill.key { background:var(--card); border:1px solid var(--line); color:var(--ink); }
.pill.clock { background:var(--card); border:1px solid var(--line); color:var(--ink); }
.pill.clock i { width:6px; height:6px; border-radius:50%; background:var(--good); animation:blink 1.2s ease-in-out infinite; animation-delay:calc(var(--t, 0) * -1ms); }
.meta button { padding:2px 10px; font-size:12px; opacity:0; }
.msg:hover .meta button { opacity:1; }
.composer { padding:6px 24px 16px; }
.box { max-width:760px; margin:0 auto; }
.hold { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 16px; margin:0 0 10px; animation:rise .25s var(--ease); }
.hold div { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.thumbs { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 8px; }
.thumbs:empty { display:none; }
.row { display:flex; align-items:flex-end; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:10px 10px 10px 12px; box-shadow:var(--shadow); transition:border-color .2s, box-shadow .25s var(--ease); }
.row:focus-within { border-color:var(--faint); box-shadow:0 1px 2px var(--halo), 0 12px 36px var(--halo), 0 0 0 4px var(--pill); }
textarea { flex:1; border:0; outline:0; resize:none; background:none; color:inherit; font:inherit; padding:6px 4px; max-height:var(--grow); }
.thinkbox { display:flex; align-items:center; gap:5px; color:var(--soft); font-size:13px; padding:0 4px 7px; cursor:pointer; white-space:nowrap; }
.thinkbox select { background:none; color:inherit; font:inherit; border:1px solid var(--line); border-radius:10px; padding:2px 4px; cursor:pointer; }
.send { background:var(--ink); color:var(--card); border-color:var(--ink); }
.send:hover { border-color:var(--ink); opacity:.86; }
.mic.on { background:var(--bad); color:var(--card); border-color:var(--bad); animation:ring 1.4s infinite; font-variant-numeric:tabular-nums; }
.hint { color:var(--faint); font-size:12px; text-align:center; margin-top:8px; }
.drop .row { border-style:dashed; border-color:var(--ink); }
.dropzone { position:fixed; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; background:rgba(246,245,241,.8); backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:opacity .18s var(--ease); }
.dropzone div { padding:30px 44px; border:2px dashed var(--ink); border-radius:24px; background:var(--card); font-family:var(--serif); font-size:24px; box-shadow:var(--shadow); transform:scale(.95); transition:transform .25s var(--ease); }
body.dragging .dropzone { opacity:1; }
body.dragging .dropzone div { transform:scale(1); }
@keyframes fade { from { opacity:0; } to { opacity:1; } }
@keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
@keyframes blink { 0%, 100% { opacity:.25; transform:scale(.8); } 50% { opacity:1; transform:scale(1); } }
@keyframes shimmer { from { background-position:150% 0; } to { background-position:-150% 0; } }
@keyframes gaze { 0%, 100% { transform:translateX(0); } 30% { transform:translateX(1.5px); } 65% { transform:translateX(-1.5px); } }
@keyframes beat { 0% { box-shadow:0 0 0 0 rgba(31,122,85,.45); } 70%, 100% { box-shadow:0 0 0 7px rgba(31,122,85,0); } }
@keyframes ring { 0% { box-shadow:0 0 0 0 rgba(180,35,42,.45); } 70%, 100% { box-shadow:0 0 0 8px rgba(180,35,42,0); } }
@media (max-width:760px) { .app { grid-template-columns:1fr; } .side { display:none; } }
@media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<p class="locked" id="locked" hidden>{locked}</p>
<div class="app" id="app" hidden>
  <div class="dropzone" id="dropzone"><div id="dropText"></div></div>
  <aside class="side">
    <span class="logo"><i id="dot"></i><span id="brand"></span></span>
    <button id="new"></button>
    <div class="chats" id="chats"></div>
  </aside>
  <section class="main">
    <header class="top">
      <div class="model" id="model"></div>
      <div class="status" id="state"></div>
    </header>
    <div class="note" id="notice" hidden></div>
    <div class="feed" id="feed"></div>
    <footer class="composer" id="composer">
      <div class="box">
        <div class="hold" id="hold" hidden></div>
        <div class="fault" id="fault" hidden></div>
        <div class="thumbs" id="thumbs"></div>
        <div class="row">
          <button id="attach"></button>
          <button class="mic" id="mic"></button>
          <textarea id="input" rows="1"></textarea>
          <label class="thinkbox"><span id="thinkText"></span><select id="think"></select></label>
          <button class="send" id="send"></button>
        </div>
        <div class="hint" id="hint"></div>
        <input type="file" id="file" multiple hidden>
      </div>
    </footer>
  </section>
</div>
<script type="module" src="/page.js"></script>
</body>
</html>
