prep_long = "Prep takes one part only, {start} to {end} s is a long video."
prep_long_hint = "Prepare shorter windows, below the long video limit."
game_running = "A game is running ({game}), so Pupil pauses to keep the game smooth."
game_running_hint = "Try again after the game; Gemini still works."
game_paused = "A game was running a moment ago, so Pupil paused the model."
