talk_upload = "The file {name} could not be taken: {detail}"
talk_upload_hint = "The largest file the chat page takes is {mb} MB."
talk_upload_gone = "An attached file is no longer there."
talk_upload_gone_hint = "Attach the file again."
talk_page_port = "The chat page could not start on port {port}: {detail}"
talk_page_port_hint = "Close the other program on this port or change page_port."
talk_page_busy = "Pupil is still writing the last answer."
talk_page_busy_hint = "Wait a moment and send again."
talk_page_crash = "Pupil hit an internal error while answering: {detail}"
talk_page_crash_hint = "Send the question again. The chat keeps running."
talk_page_key = "This page is not allowed to talk to Pupil."
talk_page_key_hint = "Start the Pupil chat again and use the link it opens."
talk_page_request = "The chat page sent a request Pupil does not understand: {detail}"
talk_page_request_hint = "Reload the page."

[harness]
exe = "wisply-full.exe"
git = "git"
model = "2b"
runs = 5
results = "bench/results.jsonl"
warmup_case = "blender-armour"
load_case = "cpp-talk"
load_question = "Summarise this talk in three short sentences."
load_words = 600
load_max_tokens = 128
load_rounds = 2
load_requests_min = 8
load_timeout = 600
concurrency = [1, 8, 32]
sample_seconds = 1.0
gpu_query = ["nvidia-smi", "--query-gpu=memory.used,power.draw", "--format=csv,noheader,nounits"]
processes = ["llama-server.exe", "wisply-full.exe"]
ram_query = ["tasklist", "/FI", "IMAGENAME eq {name}", "/FO", "CSV", "/NH"]
power_price_eur_kwh = 0.35
status_name = "status.js"
status_learn = "status-learn.json"
measurements_name = "measurements.js"
status_seconds = 2.0
status_follow_seconds = 7200
warm_estimate_seconds = 30
load_estimate_seconds = 300
run_estimate_seconds = 350

[write_eval]
cases = "bench/write-cases.json"
math = "write/gsm8k/test.jsonl"
math_count = 50
math_prompt = "{question}\nSolve it step by step. End with one last line in the form 'Answer: <number>'."
results = "bench/results-write.jsonl"
out_dir = "bench/write"
retry_seconds = 30
retry_limit = 240
warm_prompt = "Say hi."
warm_tokens = 8
german_words = "der die das und ist sind ein eine einen einem einer eines nicht mit auf zu im den dem von sich für auch oder wenn wird werden kann man bei aus nach sehr mehr durch wie noch hat haben du ich wir ihr sie es zum zur über unter gibt dass weil dein deine uns euch"
english_words = "the and is are of to with for you your it this that on be can will have has from by which or"

[think_eval]
set = "think/set100.jsonl"
results = "bench/results-think.jsonl"
out_dir = "bench/think"
letter_prompt = "{question}\n\nOptions:\n{options}\n\nEnd with one last line in the form 'Answer: <letter>'."
number_prompt = "{question}\n\nEnd with one last line in the form 'Answer: <number>'."
option_line = "{letter}. {option}"
letters = "ABCDEFGHIJ"
letter_pattern = '(?i)answer\s*[:=]\s*\**\s*\(?([A-J])\)?(?:[^A-Za-z]|$)'
loose_letter_pattern = '\b([A-J])\b'
loose_tail_chars = 80
max_tokens = 2048
budget_field = "thinking_budget_tokens"
retry_seconds = 30
retry_limit = 240
game_errors = ["game_running", "game_paused"]
warm_prompt = "Say hi."
warm_tokens = 8

[think_auto]
quiet_patterns = [
  '(?i)^this question refers to the following information',
  '(?i)\b[0-9]+-(year|month|week|day)-old\b',
  '(?i)\b(presents to|comes to the (physician|office|emergency)|is brought to the)\b',
  '(?i)\b(sued|sues|plaintiff|defendant|statute|ordinance|lawsuit|negligence|testified|the court)\b',
]
think_patterns = [
  '(?i)\b(how many|how much|calculate|compute|solve|simplify|approximate|probability|percent|average|remainder|ratio|equation|integer|prime|polynomial|derivative|integral|matrix|vector|determinant|quotient|factor|tangent|total|largest|smallest|minimum|maximum|times as|twice as|dozen|number of|census|random sample|significance level|null hypothesis|standard deviation|variance|median|confidence interval)\b',
  '(?i)\b(truth tables?|predicate logic|propositional|consistent|valid (argument|inference|form)|entail|premises?|syllogism|fallac(y|ies)|formal logic|symboli[sz]ation|translation into|if you argued|ad (hominem|populum|lazarum|baculum|verecundiam|ignorantiam|misericordiam|crumenam|nauseam|novitatem|antiquitatem))\b',
  '(?i)\b(wie viele|wie viel|berechne|rechne|löse|beweise|wahrscheinlichkeit|prozent|durchschnitt|summe|gleichung|logik|folgt daraus|schlussfolgerung)\b',
  '[$\\][a-z{(]|\^|[0-9]\s*[-+*/=<>÷×]\s*[0-9(]|%|[θπ√÷×∫∑]',
]
number_pattern = '\b[0-9][0-9,.]*\b'
min_numbers = 3
with_options = true
think_sees_options = false
option_patterns = [
  '(?i)(?:^|[^a-z0-9])(ad (hominem|lazarum|populum|crumenam|verecundiam|ignorantiam|misericordiam|baculum|novitatem|antiquitatem)|tu quoque|straw (man|person)|red herring|equivocation|begging the question|petitio principii|false (dilemma|dichotomy|cause)|slippery slope|hasty generali[sz]ation|post hoc|appeal to (authority|emotion|pity|force|ignorance|tradition|nature|popularity|fear|spite|novelty)|circular (argument|reasoning)|fallacy of (composition|division))(?:$|[^a-z0-9])',
]
goal_wrong_rate = 4.0
