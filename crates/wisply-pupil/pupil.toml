bench_cases = "The bench cases could not be read: {detail}"
bench_cases_hint = "Run pupil/bench/make_jobs.py first."
bench_out = "The bench report could not be written: {detail}"
bench_out_hint = "Check that {path} is writable."
talk_missing = "The file {path} does not exist."
talk_missing_hint = "Check the path."
talk_kind = "Pupil cannot read this kind of file yet: {name}"
talk_kind_hint = "Send a picture, a video, a sound file, a text file or a link."
talk_download = "The download of {name} failed: {detail}"
talk_download_hint = "Check the link and the internet connection."
talk_read = "Pupil could not read {name}: {detail}"
talk_read_hint = "Check that the file opens on this PC."
talk_busy = "The graphics card is busy with another Pupil job."
